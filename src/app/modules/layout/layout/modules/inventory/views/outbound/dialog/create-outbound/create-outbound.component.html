<div class="modal" style="height: 100%;">
  <div class="closerContainer">
    <i class="pi pi-times closer" (click)="closeModal()"></i>
  </div>

  <div class="title">
    <h1>Crear Salida</h1>
  </div>

  <div style=" border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; padding: 10px 20px;">
    <form [formGroup]="outboundForm" (ngSubmit)="saveChanges()">

      <h2 style="font-weight: 400; margin: 10px 0;">Formulario para creación de Salidas</h2>

      <div style="display: flex; gap: 5px; margin: 5px 0;">

        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1;">
          <label>Fecha</label>
          <p-datepicker formControlName="exit_date" />
          <!-- <small id="username-help">Enter your username to reset your password.</small> -->
        </div>
      </div>

      <div style="display: flex; gap: 5px; margin: 5px 0;">
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <label>Descripción</label>
          <textarea rows="2" cols="30" pTextarea formControlName="note"></textarea>
        </div>
      </div>

      <h3 style="font-weight: 500; margin: 15px 0 10px 0; ">Seleccione los productos</h3>
      <div [formGroup]="productsForm" style="display: flex; gap: 5px; margin: 5px 0;">

        <div style="display: flex; flex-direction: column; gap: 2px; flex: 12">
          <label>Producto</label>
          <p-select [options]="productService.products()" optionValue="id" optionLabel="name"
            formControlName="product_id" />
        </div>

        <div style="display: flex; flex-direction: column; gap: 2px; flex: 0.1">
          <label>Cantidad</label>
          <p-inputnumber inputId="integeronly" formControlName="quantity" />
        </div>

        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <label>.</label>
          <p-button icon="pi pi-send" (click)="addProduct()" />
        </div>
      </div>

      <p-table [value]="products" showGridlines [tableStyle]="{ 'min-width': '20rem', 'margin-top': '1rem'}">
        <ng-template #header>
          <tr>
            <!-- <th>Codigo</th> -->
            <th>Producto</th>
            <th>Cantidad</th>
            <th></th>
          </tr>
        </ng-template>
        <ng-template #body let-product>
          <tr>
            <!-- <td>{{ product.id }}</td> -->
            <td>{{ product.product_id }}</td>
            <td>{{ product.quantity }}</td>
            <td><i class="pi pi-trash" style="display: grid; place-items: center; color: red;"
                (click)="removeProduct(product.product_id)"></i> </td>
          </tr>
        </ng-template>
      </p-table>

      <div class="buttonContainer">
        <p-button label="Limpiar Formulario" icon="pi pi-eraser" variant="outlined" severity="danger"
          (click)="outboundForm.reset()" type="button" />
        <p-button label="Guardar Salida" icon="pi pi-send" severity="contrast" type="submit" />
      </div>
    </form>
  </div>
</div>
