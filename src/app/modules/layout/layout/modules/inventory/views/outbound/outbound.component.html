<div style="display: flex; justify-content: space-between;">
  <div class="title">
    <h1>Salidas</h1>
  </div>
  <!-- <p-button label="Resumen Inventario" icon="pi pi-arrow-left" variant="outlined" severity="secondary"
    [routerLink]="['../']" /> -->
</div>

<div class="buttonContainer" style="justify-content: space-between;">
  <p-selectbutton [options]="stateOptions" [(ngModel)]="value" optionLabel="label" optionValue="value" aria-labelledby="basic" />
  <div style="display: flex; gap: 5px;">
    <p-button label="Crear Salida" variant="outlined" severity="contrast"  (click)="openOutboundModal()" />
    <p-button label="Crear Despacho" variant="outlined" severity="contrast"  (click)="openOutboundDispatchModal()" />
  </div>
</div>

<p-table [value]="value ? outboundService.outboundDis() : outboundService.outbound()" showGridlines [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      <th>Fecha</th>
      <th>Barbero</th>
      <th>Estatus</th>
      <!-- <th>SubTotal</th> -->
      <th>Total</th>
      <th></th>
      <th></th>
      <th><div class="loader" *ngIf="outboundService.outboundDis().length == 0"></div></th>
    </tr>
  </ng-template>
  <ng-template #body let-outbound>
    <tr>
      <td>{{ outbound.created_at | date }}</td>
      <td>{{ outbound.barber_name }}</td>
      <td>{{ outbound.status }}</td>
      <!-- <td>{{ outbound.subTotal }}</td> -->
      <td>{{ outbound.total }}</td>
      <td><i class="pi pi-list" style="display: grid; place-items: center; color: rgb(12, 12, 181); cursor: pointer;" (click)="openDetailViewModal(outbound.products , 'Listado de Productos Despachados')"></i> </td>
      <td><i class="pi pi-pencil" style="display: grid; place-items: center; color: green;"></i> </td>
      <td><i class="pi pi-trash" style="display: grid; place-items: center; color: red;"></i> </td>
    </tr>
  </ng-template>
</p-table>
