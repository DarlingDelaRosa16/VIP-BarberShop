<div class="fuctionContent GeneralSpaceBetDiv" >
    <h2 style="margin: 0; font-weight: 400;"> Confirmación</h2>
    <i class="pi pi-times closer" (click)="closeSnackbar()"></i>
  </div>

  <div style="display: flex; align-items: center; margin: 15px 0; padding: 10px 0;">
    <i class="pi pi-exclamation-triangle" style="margin-right: 10px;"></i>
    <h4 style="margin: 0; font-weight: 300; font-size: 15px;">Estas seguro de eliminar </h4>
  </div>

  <div style="display: flex; justify-content: end; gap: 5px; font-weight: 100 !important;">

    <p-button size="small" variant="outlined" severity="secondary" label="Cancelar" (onClick)="closeSnackbar()" />
    <p-button size="small" [style]="{ backgroundColor: '#2563eb', borderColor: '#2563eb', color: 'white', fontWeight: '100' }" label="Aceptar" variant="outlined" (onClick)="onComfirm()" />

  </div>
