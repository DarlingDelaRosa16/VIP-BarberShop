<div class="modal">
  <div class="fuctionContent">
      <h3 class="Stitle">{{propiedad.nombre}}</h3>
  </div>

  <div>
      <div style="border:1px solid  #ccc ;">

        <p-table
        [value]="propiedad.elementoList"
        showGridlines
        [tableStyle]="{ 'min-width': '30rem' }">

        <ng-template #header>
          <tr>
            <th>Nombre</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Total</th>
          </tr>
        </ng-template>

        <ng-template #body let-elemento>
          <tr>
            <td>{{ elemento.product_name }}</td>
            <td>{{ elemento.quantity }}</td>
            <td>{{ elemento.unit_cost }}</td>
            <td>{{ elemento.subtotal }}</td>
          </tr>
        </ng-template>

      </p-table>
      </div>
   </div>
</div>
