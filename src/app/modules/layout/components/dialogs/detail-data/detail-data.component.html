<div class="modal">
  <div class="fuctionContent">
      <h2 class="Stitle">{{propiedad.nombre}}</h2>
  </div>

  <div>
      <div style="border:1px solid  #ccc ;">

        <p-table
        [value]="propiedad.elementoList"
        showGridlines
        [tableStyle]="{ 'min-width': '30rem' }">

        <ng-template #header>
          <tr>
            <th>{{propiedad.entidad}}</th>
          </tr>
        </ng-template>

        <ng-template #body let-elemento>
          <tr>
            <td>{{ elemento }}</td>
          </tr>
        </ng-template>

      </p-table>
      </div>
   </div>
</div>
