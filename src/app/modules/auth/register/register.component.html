<div class="login-container">
  <div class="login-card">
    <h2 class="title">Registro de Usuario</h2>
    <p class="subtitle">Completa el formulario para crear tu cuenta en Alex's Barbershop</p>

    <form >
      <div class="form-group">
        <label for="email">Nombre</label>
        <input type="text" pInputText  />
      </div>

      <div class="form-group">
        <label for="email">Apellido</label>
        <input type="text" pInputText  />
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="text" pInputText  />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" pInputText  />
      </div>

      <div class="form-group">
        <label for="password">Confirmar Contraseña</label>
        <input type="password" pInputText  />
      </div>

      <div class="form-group">
        <label for="email">Telefono</label>
        <input type="text" pInputText  />
      </div>

      <div class="form-group">
        <label for="email">Dirección</label>
        <input type="text" pInputText  />
      </div>

      <button type="submit" class="login-button">Registrarse</button>

      <p class="register-text">
        ¿Ya tienes una cuenta? <a routerLink="/register" class="register-link">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
