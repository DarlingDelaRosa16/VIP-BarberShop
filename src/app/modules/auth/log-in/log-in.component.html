<div class="login-container">
  <div class="login-card">
    <h2 class="loginTitle">Iniciar Sesión</h2>
    <p class="subtitle">Accede a tu cuenta en Alex's Barbershop</p>

    <form [formGroup]="loginForm" (ngSubmit)="postLogIn()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="text" pInputText formControlName="email" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" pInputText  formControlName="password" />
      </div>

      <button type="submit" class="login-button" type="submit">Iniciar Sesión</button>

      <!-- <p class="register-text">
        ¿No tienes una cuenta? <a routerLink="/register" class="register-link">Regístrate</a>
      </p> -->
    </form>
  </div>
</div>
