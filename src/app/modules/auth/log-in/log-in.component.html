<div class="login-container">

  <div>

    <div class="logo-card" >
      <img src="logo.jpg" alt="logo VIP Stylist">
    </div>

    <div class="login-card">

      <h2 class="loginTitle">Iniciar Sesión</h2>
      <p class="subtitle">Accede a tu cuenta en VIP stylist</p>

      <form [formGroup]="loginForm" (ngSubmit)="postLogIn()">
        <div class="form-group">
          <label for="email"> <i class="pi pi-envelope"></i> Correo Electrónico</label>
          <input type="text" pInputText formControlName="email" />
        </div>

        <div class="form-group">
          <label for="password"> <i class="pi pi-key"></i> Contraseña</label>
          <input type="password" pInputText formControlName="password" />
        </div>

        <button type="submit" class="login-button" type="submit"><i class="pi pi-user"></i> Iniciar Sesión</button>

      </form>
    </div>
  </div>

</div>
